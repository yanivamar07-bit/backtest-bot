name: Enable GitHub Pages

on:
  push:
    branches: [master]

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
      administration: write
    steps:
      - name: Enable GitHub Pages on gh-pages branch
        run: |
          echo "Enabling GitHub Pages..."
          RESPONSE=$(curl -s -o /tmp/pages_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "HTTP Status: $RESPONSE"
          cat /tmp/pages_response.json
          if [ "$RESPONSE" = "201" ] || [ "$RESPONSE" = "409" ]; then
            echo "SUCCESS: Pages enabled!"
          else
            echo "Trying PUT to update existing config..."
            curl -s \
              -X PUT \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi

      - name: Verify Pages status
        run: |
          sleep 5
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages | python3 -m json.tool
